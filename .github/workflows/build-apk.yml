name: Build BOMBAY DARK APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKM"
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile Android launcher
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -2
      - name: Rename installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BOMBAY-DARK-Launcher-2.0-RC2.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BOMBAY-DARK-Launcher-2.0-RC2
          path: BOMBAY-DARK-Launcher-2.0-RC2.apk
          retention-days: 30
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-2.0-rc2
          name: BOMBAY DARK Launcher 2.0 RC2
          prerelease: true
          files: BOMBAY-DARK-Launcher-2.0-RC2.apk
